[project]
name = "code-auto"
version = "1.1.0"
description = "Automation script to submit EL Center codes"
readme = "README.md"
authors = [{ name = "teoryman143", email = "jonathancortestm143@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["playwright>=1.63.0"]

[project.scripts]
code-auto = "code_auto:main"
login = "code_auto.login:main"
fill = "code_auto.fill:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.10"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]

select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes (unused imports/vars, etc.)
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # simplifications
]
ignore = [
    "E501", # line too long (formatter handles it)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
